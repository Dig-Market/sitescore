<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiteScore — SEO & AI Visibility Audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #12121f;
    --panel: #1a1a2e;
    --green: #0f9d58;
    --amber: #f4b400;
    --red: #d93025;
    --paper: #f7f6f2;
    --line: #26263d;
    --muted: #8a8aa3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
  }
  .topbar {
    background: var(--panel);
    color: #fff;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); display: inline-block; }
  .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .hero {
    max-width: 760px;
    margin: 0 auto;
    padding: 64px 24px 32px;
    text-align: center;
  }
  .hero h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 42px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 12px;
    line-height: 1.15;
  }
  .hero h1 span { color: var(--green); }
  .hero p {
    color: #55556b;
    font-size: 16px;
    line-height: 1.6;
    margin: 0 auto;
    max-width: 520px;
  }

  .panel {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid #e4e2d8;
    border-radius: 10px;
    padding: 28px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.02);
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #e0ded2;
    border-radius: 6px;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    background: var(--paper);
    color: var(--ink);
    transition: border-color 0.15s;
  }
  .field input:focus { outline: none; border-color: var(--green); background: #fff; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .btn {
    width: 100%;
    padding: 14px;
    background: var(--panel);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: background 0.15s;
    margin-top: 6px;
  }
  .btn:hover { background: #24243f; }
  .btn:disabled { background: #ababc2; cursor: not-allowed; }

  .status {
    max-width: 640px;
    margin: 20px auto 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    min-height: 20px;
  }
  .status.error { color: var(--red); }

  #results {
    max-width: 720px;
    margin: 32px auto 80px;
    display: none;
  }
  .scorebar {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    background: #fff;
    border: 1px solid #e4e2d8;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .scorecell {
    padding: 20px 8px;
    text-align: center;
    border-right: 1px solid #e4e2d8;
  }
  .scorecell:last-child { border-right: none; }
  .scorecell .num {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 32px;
    font-weight: 700;
    line-height: 1;
  }
  @media (max-width: 640px) {
    .scorebar { grid-template-columns: repeat(3, 1fr); }
    .scorecell:nth-child(3) { border-right: none; }
  }
  .pagetable {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    font-size: 13px;
  }
  .pagetable th, .pagetable td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid #eeede5;
  }
  .pagetable th { background: var(--panel); color: #fff; font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; }
  .pagetable td.num { text-align: center; font-family: 'IBM Plex Mono', monospace; }
  .pagetable td.url { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scorecell .lbl {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 6px;
  }
  .pass { color: var(--green); }
  .warn { color: var(--amber); }
  .fail { color: var(--red); }

  .download-btn {
    display: block;
    width: 100%;
    text-align: center;
    padding: 14px;
    background: var(--green);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    font-weight: 600;
    margin-bottom: 24px;
  }
  .download-btn:hover { background: #0c8449; }

  .checklist { background: #fff; border: 1px solid #e4e2d8; border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
  .checklist h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    margin: 0;
    padding: 14px 18px;
    background: var(--panel);
    color: #fff;
  }
  .check-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 18px;
    border-top: 1px solid #eeede5;
    font-size: 14px;
  }
  .check-item .cname { color: var(--ink); font-weight: 500; }
  .check-item .cval { color: #77778e; font-size: 13px; margin-top: 2px; }
  .check-status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    white-space: nowrap;
    margin-left: 12px;
  }

  footer {
    text-align: center;
    padding: 24px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  @media (max-width: 640px) {
    .hero h1 { font-size: 32px; }
    .row-2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span>SiteScore</div>
  <div class="tag">SEO + AEO Audit Engine</div>
</div>

<div class="hero">
  <h1>How visible is your site to <span>Google and AI</span>?</h1>
  <p>Crawls your whole site and scores SEO, AEO, GEO, and technical health page-by-page. Get a client-ready PDF report.</p>
</div>

<div class="panel">
  <form id="auditForm">
    <div class="field">
      <label for="url">Website URL</label>
      <input type="text" id="url" name="url" placeholder="example.com" required>
    </div>
    <div class="row-2">
      <div class="field">
        <label for="agency_name">Your Agency Name</label>
        <input type="text" id="agency_name" name="agency_name" placeholder="Dig Market" value="Dig Market">
      </div>
      <div class="field">
        <label for="client_name">Client Name (optional)</label>
        <input type="text" id="client_name" name="client_name" placeholder="e.g. Smiths Blade">
      </div>
    </div>
    <div class="field">
      <label for="max_pages">Pages to Crawl (max 30)</label>
      <input type="number" id="max_pages" name="max_pages" value="15" min="1" max="30">
    </div>
    <button type="submit" class="btn" id="submitBtn">Run Full Site Audit</button>
  </form>
</div>

<div class="status" id="status"></div>

<div id="results"></div>

<footer>SiteScore — built by Dig Market</footer>

<script>
const form = document.getElementById('auditForm');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');
const submitBtn = document.getElementById('submitBtn');

function scoreClass(score) {
  if (score >= 80) return 'pass';
  if (score >= 50) return 'warn';
  return 'fail';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  statusEl.className = 'status';
  statusEl.textContent = 'Crawling site and running checks — this can take a minute for multiple pages...';
  resultsEl.style.display = 'none';
  submitBtn.disabled = true;
  submitBtn.textContent = 'Scanning site...';

  const formData = new FormData(form);
  try {
    const res = await fetch('/analyze', { method: 'POST', body: formData });
    const data = await res.json();

    if (!res.ok) {
      statusEl.className = 'status error';
      statusEl.textContent = data.error || 'Something went wrong.';
      return;
    }

    statusEl.textContent = '';
    renderResults(data);
  } catch (err) {
    statusEl.className = 'status error';
    statusEl.textContent = 'Network error — please try again.';
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Run Full Site Audit';
  }
});

function renderChecklist(title, checks) {
  let html = `<div class="checklist"><h3>${title}</h3>`;
  checks.forEach(c => {
    const cls = c.pass ? 'pass' : 'fail';
    const status = c.pass ? 'PASS' : 'NEEDS WORK';
    html += `
      <div class="check-item">
        <div>
          <div class="cname">${c.name}</div>
          <div class="cval">${c.value}</div>
        </div>
        <div class="check-status ${cls}">${status}</div>
      </div>`;
  });
  html += `</div>`;
  return html;
}

function renderResults(data) {
  let html = `
    <div class="scorebar">
      <div class="scorecell"><div class="num ${scoreClass(data.overall_score)}">${data.overall_score}</div><div class="lbl">Overall</div></div>
      <div class="scorecell"><div class="num ${scoreClass(data.seo_score)}">${data.seo_score}</div><div class="lbl">SEO</div></div>
      <div class="scorecell"><div class="num ${scoreClass(data.aeo_score)}">${data.aeo_score}</div><div class="lbl">AEO</div></div>
      <div class="scorecell"><div class="num ${scoreClass(data.geo_score)}">${data.geo_score}</div><div class="lbl">GEO</div></div>
      <div class="scorecell"><div class="num ${scoreClass(data.tech_score)}">${data.tech_score}</div><div class="lbl">Technical</div></div>
    </div>
    <a href="/download/${data.pdf_filename}" class="download-btn">Download Full PDF Report (${data.pages_crawled} pages)</a>
  `;

  html += renderChecklist('Site-Wide Technical Checks', data.site_technical_checks);
  html += renderChecklist('Cross-Page Issues', data.site_wide_issues);

  // Per-page table
  html += `<div class="checklist"><h3>Per-Page Scores (${data.pages.length} pages crawled)</h3>
    <div style="overflow-x:auto;">
    <table class="pagetable">
      <thead><tr><th>Page</th><th>SEO</th><th>AEO</th><th>GEO</th><th>Tech</th></tr></thead>
      <tbody>`;
  data.pages.forEach(p => {
    html += `<tr>
      <td class="url" title="${p.url}">${p.url}</td>
      <td class="num ${scoreClass(p.seo_score)}">${p.seo_score}</td>
      <td class="num ${scoreClass(p.aeo_score)}">${p.aeo_score}</td>
      <td class="num ${scoreClass(p.geo_score)}">${p.geo_score}</td>
      <td class="num ${scoreClass(p.tech_score)}">${p.tech_score}</td>
    </tr>`;
  });
  html += `</tbody></table></div></div>`;

  // Homepage detail (first page in array) as example on-screen detail
  const home = data.pages[0];
  if (home) {
    html += renderChecklist(`Homepage — On-Page SEO`, home.seo_checks);
    html += renderChecklist(`Homepage — AEO`, home.aeo_checks);
    html += renderChecklist(`Homepage — GEO`, home.geo_checks);
    html += renderChecklist(`Homepage — Technical`, home.tech_checks);
  }

  resultsEl.innerHTML = html;
  resultsEl.style.display = 'block';
}
</script>

</body>
</html>
